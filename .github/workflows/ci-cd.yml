name: CI/CD — Build, Push & Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Image Tag
        id: tag
        run: echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.tag.outputs.TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:latest \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update ECS Task Definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ secrets.ECS_TASK_DEFINITION_ARN }}
          container-name: ecs-ha-app
          image: ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }}

      - name: Deploy to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Print Success
        run: |
          echo "✅ Deployed: ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }}"
          echo "🚀 ECS Service updated successfully"
