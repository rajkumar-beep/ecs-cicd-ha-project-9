name: CI — Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Image Tag
        id: tag
        run: echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.tag.outputs.TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:latest \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:latest

      - name: Print Success
        run: |
          echo "✅ Image pushed: ${{ secrets.DOCKER_USERNAME }}/ecs-ha-app:${{ steps.tag.outputs.TAG }}"
